{% set version = "3.14.1" %}
{% set name = "geos" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/lib{{ name }}/{{ name }}/archive/refs/tags/{{ version }}.tar.gz
  sha256: 512118b3be3ccefbca66b36b0f3e895576d08d6ff330ba1511a31a306abbb477
  patches:
    - patches/0001-unconditional-geos-pc.patch
    - patches/0002-include-cstddef.patch

build:
  number: 1
  skip: true  # [win and vc<14]
  run_exports:
    # pretty poor backcompat.  SO name changes each release.
    # https://abi-laboratory.pro/tracker/timeline/geos/
    - {{ pin_subpackage('geos', max_pin='x.x.x') }}

requirements:
  build:
    - {{ stdlib('c') }}
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - cmake
    - make           # [not win]
    - ninja-base     # [win]

test:
  commands:
    - geos-config --version  # [not win]

about:
  home: https://libgeos.org/
  license: LGPL-2.1-or-later
  license_family: LGPL
  license_file: COPYING
  summary: Geometry Engine - Open Source
  description: |
    GEOS (Geometry Engine - Open Source) is a C++ port of the Java Topology
    Suite (JTS). As such, it aims to contain the complete functionality of
    JTS in C++.
  doc_url: https://libgeos.org/
  dev_url: https://github.com/libgeos/geos

extra:
  recipe-maintainers:
    - ocefpaf
    - pelson
    - gillins
    - msarahan
    - xylar
